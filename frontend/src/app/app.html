<nav class="navbar" *ngIf="!isLoginRoute">
  <div class="container nav-inner">
    <a class="navbar-brand brand" routerLink="/scenarios" aria-label="Scenarii">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 12h4l2.4-6 3.8 12 2.4-6H21" />
      </svg>
      <span>Scenarii</span>
    </a>

    <div id="app-nav" class="nav-links" [class.is-open]="menuOpen" *ngIf="status().authenticated">
      <a
        class="nav-link-quiet"
        routerLink="/scenarios"
        routerLinkActive="is-active"
        (click)="menuOpen = false"
        >{{ t('nav.dashboard') }}</a
      >
      <a
        class="nav-link-quiet"
        routerLink="/overview"
        routerLinkActive="is-active"
        (click)="menuOpen = false"
        >{{ t('nav.overview') }}</a
      >
      <a
        *ngIf="isAdmin()"
        class="nav-link-quiet"
        routerLink="/users"
        routerLinkActive="is-active"
        (click)="menuOpen = false"
        >{{ t('nav.users') }}</a
      >
      <a
        class="nav-link-quiet"
        routerLink="/docs"
        routerLinkActive="is-active"
        (click)="menuOpen = false"
        >{{ t('nav.docs') }}</a
      >
      <a
        class="nav-link-quiet"
        routerLink="/artifacts"
        routerLinkActive="is-active"
        (click)="menuOpen = false"
        >Artifacts</a
      >
    </div>

    <div class="nav-actions" *ngIf="status().authenticated">
      <span *ngIf="authDisabled()" class="status is-warn auth-off" [title]="t('login.open_disabled')">
        {{ t('nav.auth_disabled') }}
      </span>

      <a
        class="nav-profile"
        routerLink="/profile"
        routerLinkActive="is-active"
        [title]="t('nav.signed_in_as', { username: status().username || '' })"
      >
        <img
          *ngIf="status().avatar_url; else avatarGlyph"
          [src]="status().avatar_url"
          class="nav-avatar"
          [alt]="t('nav.profile')"
        />
        <ng-template #avatarGlyph>
          <i class="bi bi-person-circle" aria-hidden="true"></i>
        </ng-template>
        <span class="nav-profile-name">{{ t('nav.profile') }}</span>
      </a>

      <button
        *ngIf="status().authenticated && !authDisabled()"
        class="btn-icon nav-signout"
        type="button"
        (click)="logout()"
        [title]="t('nav.signout_title')"
        [attr.aria-label]="t('nav.signout')"
      >
        <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
      </button>

      <button
        class="btn-icon menu-toggle"
        type="button"
        (click)="menuOpen = !menuOpen"
        [attr.aria-expanded]="menuOpen"
        aria-controls="app-nav"
        [attr.aria-label]="t('nav.dashboard')"
      >
        <i class="bi" [class.bi-list]="!menuOpen" [class.bi-x-lg]="menuOpen" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</nav>

<div
  class="app-main"
  [class.container]="!isLoginRoute"
  [class.app-main-landing]="isLoginRoute"
>
  <router-outlet />
</div>

<footer class="app-footer">
  <div class="container">
    <span class="footer-brand">Scenarii</span>
    <span>&copy; 2026 GiwiSoft</span>
    <a href="https://github.com/Giwi/giwisoft-scenarii/blob/main/LICENSE" target="_blank" rel="noopener"
      >GPL-3.0</a
    >
    <a href="https://github.com/Giwi/giwisoft-scenarii" target="_blank" rel="noopener">GitHub</a>
  </div>
</footer>
