<div class="page-head">
  <div class="editor-head">
    <a
      [routerLink]="isNew ? '/scenarios' : '/scenario/' + scenarioName"
      class="btn-icon"
      [title]="t('editor.back_title')"
      [attr.aria-label]="t('editor.back_title')"
    >
      <i class="bi bi-arrow-left" aria-hidden="true"></i>
    </a>
    <h1 class="page-title">
      {{ isNew ? t('editor.new_title') : t('editor.edit_title', { name: scenarioName }) }}
    </h1>
  </div>
  <div class="page-actions">
    <a *ngIf="isNew" class="btn btn-sm btn-outline-secondary" routerLink="/scenarios" [title]="t('editor.back_to_scenarios')">
      {{ t('list.title') }}
    </a>
    <button class="btn btn-sm btn-primary" type="button" (click)="save()" [disabled]="saving">
      <span class="spinner-border spinner-border-sm me-2" *ngIf="saving" aria-hidden="true"></span>
      {{ saving ? t('common.saving') : isNew ? t('editor.create') : t('common.save') }}
    </button>
  </div>
</div>

<div class="alert alert-success" *ngIf="saved" role="alert">
  {{ t('editor.saved') }}
</div>
<div class="alert alert-danger" *ngIf="error" role="alert">
  {{ error }}
</div>

<div class="card">
  <div class="card-body p-0">
    <!-- Highlighted layer under a transparent textarea: both share identical metrics. -->
    <div class="editor">
      <pre #layer class="editor-layer" aria-hidden="true"><code><span
        *ngFor="let p of parts"
        [class]="'tok ' + p.cls"
        >{{ p.text }}</span
      ></code></pre>
      <textarea
        #ta
        class="editor-input"
        [(ngModel)]="yaml"
        (ngModelChange)="onYamlChange()"
        (scroll)="syncScroll(layer, ta)"
        spellcheck="false"
        autocomplete="off"
        autocapitalize="off"
      ></textarea>
    </div>
  </div>
</div>

<p class="small text-secondary mt-2 mb-0">
  {{ t('editor.hint') }}
</p>
